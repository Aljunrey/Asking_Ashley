<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Will you be my GirlFriend?</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--Envelope Screen-->
    <div id="envelope-container">
      <img src="envelope.png" alt="Envelope" id="envelope" />
      <p>Letter for you</p>
    </div>

    <!--Letter Screen-->
    <div id="letter-container">
      <div class="letter-window">
        <h1 id="heading">Will you be my GirlFriend? ❤️</h1>
        <img src="cat_heart.gif" class="cat" id="letter-cat" alt="Cat" />
        <div class="buttons" id="letter-buttons">
          <img src="yes.png" class="btn yes-btn" alt="YES" />
          <div class="no-wrapper">
            <img src="no.png" class="btn no-btn" alt="NO" />
          </div>
        </div>
        <p id="message" class="final-text" style="display: none">
          <strong>Hiii my Beautiful Girlfriend! 🥰</strong>
        </p>
      </div>
    </div>
    <!-- this was missing -->

    <script src="script.js"></script>

    <script src="script.js"></script>
  </body>
</html>
